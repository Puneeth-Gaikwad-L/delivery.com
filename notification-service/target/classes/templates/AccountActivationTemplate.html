<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Email Verification</title>
    <style>
        .container {
            text-align: center;
            font-family: Arial, sans-serif;
            padding: 20px;
            background-color: #f9f9f9;
            border-radius: 10px;
            width: 80%;
            margin: auto;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        .verified {
            color: green;
        }
        h1{
            color: #CA9090;
        }
        .icon {
            width: 50px;
            height: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 20px;
        }
        .icon img {
            width: 100%;
            height: 100%;
        }

        span{
            color:#f04343;
            font-weight: 600;
        }

    </style>
</head>
<body>
<div class="container">
    <div class="icon">
        <img src="https://res.cloudinary.com/dhxuxqgdi/image/upload/fl_preserve_transparency/v1746774743/splash-icon_lu6vwe.jpg?_s=public-apps" alt="Delivery.com">
    </div>
    <h3>Your account has been <span class="verified">Activated</span></h3>
    <img src="https://res.cloudinary.com/dhxuxqgdi/image/upload/fl_preserve_transparency/v1747139106/Welcome_pyifna.jpg?_s=public-apps" alt="Email Verified" style="width: 300px; height: auto;">
    <p>Welcome to <span>Delivery.com!</span></p>
    <p>Enjoy exploring our services.</p>
</div>
</body>
</html>
