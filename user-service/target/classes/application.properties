spring.application.name=user-service
server.port=0

spring.datasource.url=jdbc:postgresql://localhost:5432/DeliveryDotCom?createTableIfNotExists=true
spring.datasource.username=postgres
spring.datasource.password=Puneeth@018
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# Enable Redis as cache
spring.cache.type=redis

# Redis configuration
spring.redis.host=localhost
spring.redis.port=6379
# spring.redis.password=yourpassword  # Uncomment if needed

# Optional: connection timeout
spring.redis.timeout=60000

eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true
eureka.instance.hostname=localhost
eureka.instance.instance-id=${spring.application.name}:${server.port}
eureka.instance.appname=${spring.application.name}
#kafka config
spring.kafka.bootstrap-servers=localhost:9092

# Producer settings
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.type.mapping=event:com.delivery.user_service.Events.EmailVerifiedEvent
